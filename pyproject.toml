[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scan-git-push"
version = "0.1.0"
description = "Analyze git push changes with LLM-powered commit summaries"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "PyGithub>=2.1.0",
    "ollama>=0.1.0",
    "openai>=1.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
scan-git-push = "scan_git_push.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scan_git_push"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external services (Ollama, GitHub API)",
    "slow: marks tests that are slow",
]

[tool.coverage.run]
source = ["scan_git_push"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
